<div class="dashboard">
  <aside class="sidebar" aria-label="ניווט ראשי">
    <a class="brand" routerLink="/" aria-label="מרחב ניהולי — דף הבית">
      <span class="brand-mark" aria-hidden="true">מ</span>
      <span class="brand-name">מרחב ניהולי</span>
    </a>

    <nav class="sidebar-section" aria-label="סביבת עבודה">
      <p class="sidebar-label">סביבת עבודה</p>
      <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v9a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 19z"/><path d="M9 20.5v-7h6v7"/></svg>
        <span>דף הבית</span>
      </a>
      <a class="nav-item" routerLink="/team" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.8 20v-1.2A5.2 5.2 0 0 1 8 13.6h2a5.2 5.2 0 0 1 5.2 5.2V20zM16 4.7a3.5 3.5 0 0 1 0 6.6M17 14a5.2 5.2 0 0 1 4.2 5.1V20h-4"/></svg>
        <span>הצוות שלי</span>
      </a>
    </nav>

    <div class="sidebar-note">
      <span class="note-icon" aria-hidden="true">✦</span>
      <p>מרחב קטן<br>לעשייה גדולה.</p>
      <span class="note-caption">נעים לעבוד יחד</span>
    </div>

    <div class="profile">
      <span class="profile-avatar" aria-hidden="true">א</span>
      <span class="profile-copy"><strong>אזור אישי</strong><small>ברוכה הבאה</small></span>
      <span class="profile-dots" aria-hidden="true">···</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumb"><span>המרחב שלי</span><span class="breadcrumb-separator">/</span><strong>מרחב ניהולי</strong></div>
      <div class="topbar-actions">
        <span class="today">יום טוב ומלא השראה</span>
        <span class="topbar-avatar" aria-label="פרופיל אישי">א</span>
      </div>
    </header>
    <router-outlet />
  </main>
</div>
