<div class="users-grid">
  @for(item of users; track item.name) {
    <article class="user-card">
      <div class="user-topline">
        <span class="user-avatar" aria-hidden="true">{{ item.name.charAt(0) }}</span>
        <button class="more-button" type="button" aria-label="פעולות עבור {{ item.name }}">···</button>
      </div>
      <h3>{{ item.name }}</h3>
      <a class="user-email" href="mailto:{{ item.email }}">{{ item.email }}</a>
      <div class="user-details">
        <div class="detail-row">
          <span class="detail-icon" aria-hidden="true">☎</span>
          <span>{{ item.phone }}</span>
        </div>
        <div class="detail-row address-row">
          <span class="detail-icon" aria-hidden="true">⌖</span>
          <span>{{ item.address }}</span>
        </div>
      </div>
      <div class="user-actions">
        <button class="edit-button" type="button" (click)="editUser(item.name)">עריכה</button>
        <button class="delete-button" type="button" (click)="deleteUser(item.name)">הסרה</button>
      </div>
    </article>
  }
</div>
